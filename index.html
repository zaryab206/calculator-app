<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled placeholder="0">
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button onclick="insert('(')">(</button>
      <button onclick="insert(')')">)</button>
      <button onclick="insert('Math.PI')">π</button>
      <button onclick="insert('Math.E')">e</button>
      <button onclick="insert('^')">^</button>
      <button onclick="insert('/')">÷</button>

      <button onclick="insert('7')">23</button>
      <button onclick="insert('8')">8</button>
      <button onclick="insert('9')">9</button>
      <button onclick="insert('*')">×</button>

      <button onclick="insert('4')">4</button>
      <button onclick="insert('5')">5</button>
      <button onclick="insert('6')">6</button>
      <button onclick="insert('-')">−</button>

      <button onclick="insert('1')">1</button>
      <button onclick="insert('2')">2</button>
      <button onclick="insert('3')">3</button>
      <button onclick="insert('+')">+</button>

      <button onclick="insert('0')">0</button>
      <button onclick="insert('.')">.</button>
      <button onclick="func('Math.log10')">log</button>

      <button onclick="func('Math.sin')">sin</button>
      <button onclick="func('Math.cos')">cos</button>
      <button onclick="func('Math.tan')">tan</button>
      <button onclick="func('Math.sqrt')">√</button>
      <button onclick="calculate()">=</button>
     
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
